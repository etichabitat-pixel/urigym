<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UriGym</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0b10">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="screen"></main>
  <nav id="tabbar" class="tabbar">
    <button class="tab-btn" data-tab="today"><span data-icon="home"></span><br>Avui</button>
    <button class="tab-btn" data-tab="diet"><span data-icon="diet"></span><br>Dieta</button>
    <button class="tab-btn" data-tab="exercises"><span data-icon="exercises"></span><br>Exercicis</button>
    <button class="tab-btn" data-tab="progress"><span data-icon="progress"></span><br>Progrés</button>
    <button class="tab-btn" id="settings-btn"><span data-icon="settings"></span><br>Config</button>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
